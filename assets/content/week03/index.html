<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reveal.js</title>
  <link rel="stylesheet" href="../../libs/reveal/reveal.css">
  <link rel="stylesheet" href="../../libs/reveal/theme/white.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <h1>Reveal.js</h1>
        <p>Τοπική παρουσίαση με την ενσωματωμένη βιβλιοθήκη Reveal.js.</p>
      </section>
      <section>
        <h2>Πλοήγηση</h2>
        <p>Χρησιμοποιήστε τα βέλη του πληκτρολογίου ή τα χειριστήρια για να αλλάξετε διαφάνεια.</p>
      </section>
      <section>
        <h2>Συγγραφή</h2>
        <p>Προσθέστε κάθε διαφάνεια ως στοιχείο <code>&lt;section&gt;</code> μέσα στο <code>.slides</code>.</p>
      </section>
    </div>
  </div>
  <script src="../../libs/reveal/reveal.js"></script>
  <script>
    Reveal.initialize({
      controls: true,
      progress: true,
      hash: true,
      slideNumber: 'c/t'
    });
  </script>
</body>
</html>
